<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ScanBarre · fiable</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #0b1a2a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 8px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: #f8fafd;
            border-radius: 32px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.3);
            overflow: hidden;
            padding: 20px 16px 30px;
            border: 1px solid #bed9f0;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b2b3b;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .sub {
            color: #2f5170;
            margin-bottom: 20px;
            font-size: 0.95rem;
            border-left: 4px solid #2e86c1;
            padding-left: 12px;
        }
        #scanner-btn {
            background: #0a2c3d;
            border: none;
            color: white;
            font-size: 1.7rem;
            font-weight: 600;
            padding: 18px 16px;
            border-radius: 60px;
            width: 100%;
            display: flex;
;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 16px rgba(8,40,60,0.5);
            cursor: pointer;
            transition: all 0.1s ease;
            margin: 16px 0 18px;
            border: 1px solid #3980a3;
        }
        #scanner-btn:active {
            transform: scale(0.97);
            background: #06212e;
        }
        #scanner-btn:disabled {
            opacity: 0.5;
            transform: none;
            pointer-events: none;
        }
        .video-wrapper {
            background: #000000;
            border-radius: 38px;
            overflow: hidden;
            position: relative;
            width: 100%;
            aspect-ratio: 4/3;
            margin-bottom: 10px;
            border: 3px solid #2c577a;
            display: none;
            box-shadow: inset 0 0 10px #00000055;
        }
        .video-wrapper.active {
            display: block;
        }
        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transform: rotate(0deg); /* pas de mirror forcing, orientation naturelle */
        }
        #stop-scan {
            background: #c0392b;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 15px 20px;
            font-size: 1.4rem;
            font-weight: 600;
            width: 100%;
            margin: 5px 0 15px;
            cursor: pointer;
            border: 1px solid #a03224;
            transition: 0.1s;
        }
        #stop-scan:active {
            background: #a03224;
        }
        .card-result {
            background: white;
            border-radius: 30px;
            padding: 18px 16px;
            box-shadow: 0 4px 12px #abc0d3;
            margin: 10px 0 8px;
            border: 1px solid #bcd3e8;
        }
        .result-header {
            font-size: 1.25rem;
            font-weight: 600;
            color: #16344b;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }
        .result-content {
            background: #f0f5fc;
            border-radius: 24px;
            padding: 16px 14px;
            max-height: 340px;
            overflow-y: auto;
            font-size: 1rem;
            line-height: 1.5;
            border: 1px solid #c9ddf3;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .error-box {
            background: #ffeae8;
            border-left: 6px solid #b03a2e;
            padding: 16px;
            border-radius: 24px;
            font-weight: 500;
        }
        .badge-code {
            background: #1f5e8c;
            color: white;
            border-radius: 40px;
            padding: 5px 18px;
            font-size: 1rem;
            display: inline-block;
            margin-bottom: 10px;
        }
        .note {
            color: #2a4e6e;
            text-align: center;
            font-size: 0.85rem;
            margin-top: 18px;
        }
        .debug-hint {
            background: #e5eff9;
            padding: 12px;
            border-radius: 30px;
            color: #0f3e5c;
            text-align: center;
        }
        button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <!-- ZXing robuste version umd -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
</head>
<body>
<div class="container">
    <h1>🔍 <span style="font-size: 1.8rem;">scan&nbsp;·&nbsp;barre</span></h1>
    <div class="sub">pointez le code, tout type d'article</div>

    <!-- zone vidéo -->
    <div class="video-wrapper" id="videoWrapper">
        <video id="video" playsinline></video>
    </div>

    <!-- boutons de contrôle -->
    <button id="stop-scan" style="display: none;">⏹ ARRÊTER LE SCAN</button>
    <button id="scanner-btn">
        <span style="font-size: 2.2rem;">📷</span> SCANNER UN ARTICLE
    </button>

    <!-- panneau résultat -->
    <div class="card-result">
        <div class="result-header"><span>📦</span> Informations trouvées</div>
        <div class="result-content" id="resultDisplay">
            <div class="debug-hint">En attente d’un scan...</div>
        </div>
    </div>
    <div class="note">✅ base open food facts + open library (livres) · scan automatique</div>
</div>

<script>
(function() {
    // --- DOM ---
    const scannerBtn = document.getElementById('scanner-btn');
    const stopBtn = document.getElementById('stop-scan');
    const video = document.getElementById('video');
    const videoWrapper = document.getElementById('videoWrapper');
    const resultDisplay = document.getElementById('resultDisplay');

    // --- État interne ---
    let mediaStream = null;
    let codeReader = null;
    let isScanning = false;
    let scanController = null; // pas utilisé directement, mais on garde

    // --- fonction arrêt total ---
    function stopEverything() {
        if (!isScanning && !mediaStream) return;

        // Arrêter les pistes caméra
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }

        // Détacher la source vidéo
        video.srcObject = null;

        // Reset UI
        videoWrapper.classList.remove('active');
        stopBtn.style.display = 'none';
        scannerBtn.disabled = false;
        isScanning = false;

        // Lâcher le reader (aucune méthode stop explicite, on oublie l'instance)
        codeReader = null;
    }

    // --- affichage résultat ou erreur ---
    function setResult(content, isError = false, barcode = null) {
        if (isError) {
            resultDisplay.innerHTML = `<div class="error-box">❌ ${content}</div>`;
            return;
        }
        if (typeof content === 'string') {
            resultDisplay.innerHTML = content; // déjà formaté
        } else {
            // content = { code, details }
            let html = `<div class="badge-code">✅ code: ${content.code}</div>`;
            if (content.details && content.details.length > 5) {
                html += `<pre style="font-family:inherit; white-space:pre-wrap;">${content.details}</pre>`;
            } else {
                html += `<div class="error-box">⚠️ Aucune information trouvée sur les bases gratuites.</div>`;
            }
            resultDisplay.innerHTML = html;
        }
    }

    // --- Appels aux bases de données (double source) ---
    async function fetchFromDatabases(barcode) {
        const code = barcode.trim();
        // Sources : Open Food Facts + Open Library (ISBN)
        const results = {
            code: code,
            details: ''
        };

        // Promesses avec timeout court (4 secondes) pour ne pas bloquer
        const timeout = (ms) => new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms));

        const offPromise = fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json`)
            .then(res => res.ok ? res.json() : Promise.reject())
            .catch(() => null);

        const olPromise = fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${code}&format=json&jscmd=data`)
            .then(res => res.json())
            .catch(() => null);

        // On attend les deux avec un délai raisonnable
        const [offData, olData] = await Promise.allSettled([offPromise, olPromise]);

        const parts = [];

        // --- Open Food Facts ---
        if (offData.status === 'fulfilled' && offData.value && offData.value.status === 1) {
            const p = offData.value.product;
            const name = p.product_name || p.generic_name || 'Nom inconnu';
            const brand = p.brands || 'Marque inconnue';
            parts.push(`🍏 OPEN FOOD FACTS :`);
            parts.push(`📛 ${name} (${brand})`);
            if (p.quantity) parts.push(`📦 ${p.quantity}`);
            if (p.ingredients_text) parts.push(`🧪 Ingrédients: ${p.ingredients_text.substring(0,150)}...`);
            if (p.nutriscore_grade) parts.push(`⚖️ Nutriscore: ${p.nutriscore_grade.toUpperCase()}`);
            if (p.ecoscore_grade) parts.push(`🌿 Ecoscore: ${p.ecoscore_grade.toUpperCase()}`);
            if (p.categories) parts.push(`🏷️ Catégories: ${p.categories.split(',').slice(0,3).join(', ')}`);
            parts.push(`🔗 https://fr.openfoodfacts.org/produit/${code}`);
        } else {
            parts.push(`🍏 Open Food Facts : produit non référencé.`);
        }

        parts.push('---');

        // --- Open Library (livres) ---
        if (olData.status === 'fulfilled' && olData.value && olData.value[`ISBN:${code}`]) {
            const book = olData.value[`ISBN:${code}`];
            const title = book.title || 'Titre inconnu';
            const authors = book.authors ? book.authors.map(a => a.name).join(', ') : 'Auteur inconnu';
            const publishers = book.publishers ? book.publishers.map(p => p.name).join(', ') : 'Éditeur inconnu';
            const publishDate = book.publish_date || 'Date inconnue';
            parts.push(`📚 OPEN LIBRARY (LIVRE) :`);
            parts.push(`📖 ${title}`);
            parts.push(`✍️ ${authors}`);
            parts.push(`🏢 ${publishers} (${publishDate})`);
            if (book.number_of_pages) parts.push(`📄 ${book.number_of_pages} pages`);
            parts.push(`🌐 https://openlibrary.org/isbn/${code}`);
        } else {
            parts.push(`📘 Open Library : aucun livre pour cet ISBN.`);
        }

        results.details = parts.join('\n');
        return results;
    }

    // --- Démarrer le scanner (corrigé orientation et robustesse) ---
    async function startScan() {
        if (isScanning) {
            stopEverything();
            return;
        }

        // Reset affichage
        resultDisplay.innerHTML = `<div class="debug-hint">📡 Activation caméra...</div>`;

        try {
            // Demander caméra ARRIÈRE impérativement (environement)
            const constraints = {
                video: {
                    facingMode: { exact: 'environment' }, // Force arrière, sinon erreur -> on a un fallback
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                },
                audio: false
            };

            // Tentative avec fallback si environnement exact échoue
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia(constraints);
            } catch (err) {
                console.warn('caméra arrière non disponible, on prend la première dispo');
                // fallback sans facingMode exact
                const fallbackConstraints = { video: { facingMode: 'environment' }, audio: false };
                stream = await navigator.mediaDevices.getUserMedia(fallbackConstraints);
            }

            mediaStream = stream;
            video.srcObject = stream;

            // Afficher UI
            videoWrapper.classList.add('active');
            stopBtn.style.display = 'block';
            scannerBtn.disabled = true;
            isScanning = true;

            // Lire la vidéo (nécessaire sur iOS)
            await video.play();

            // Initialiser le reader
            codeReader = new ZXing.BrowserMultiFormatReader();
            const hints = new Map();
            // On accepte une grande variété de formats (EAN, UPC, CODE128, ISBN, etc.)
            codeReader.hints = hints;

            // Démarrer le decoding en continu (sans mirror bug)
            codeReader.decodeFromVideoElement(video, (result, err) => {
                // Si result présent et pas d'erreur fatale
                if (result) {
                    const barcode = result.getText();
                    if (barcode && barcode.length > 3) {
                        // STOPPER IMMÉDIATEMENT
                        stopEverything(); // stop caméra + nettoyage

                        // Afficher recherche
                        resultDisplay.innerHTML = `<div class="debug-hint">🔎 Interrogation base pour <strong>${barcode}</strong>...</div>`;

                        // Lancer la récupération
                        fetchFromDatabases(barcode).then(product => {
                            setResult(product, false);
                        }).catch(e => {
                            setResult(`Erreur appel API: ${e.message}`, true);
                        });
                    }
                }
                // Ne pas réagir aux "No MultiFormatReader" qui sont normaux
            });

        } catch (err) {
            console.error('Erreur scan:', err);
            stopEverything(); // nettoie au cas où

            let errorMsg = err.message || 'Impossible de démarrer la caméra. Vérifiez les permissions.';
            if (err.name === 'NotAllowedError') errorMsg = 'Autorisation caméra refusée.';
            else if (err.name === 'NotFoundError') errorMsg = 'Aucune caméra trouvée.';

            setResult(errorMsg, true);
            scannerBtn.disabled = false; // réactiver si stop ne l'a pas fait
            videoWrapper.classList.remove('active');
            stopBtn.style.display = 'none';
            isScanning = false;
        }
    }

    // --- gestionnaires ---
    scannerBtn.addEventListener('click', startScan);

    stopBtn.addEventListener('click', () => {
        stopEverything();
        // Ne pas effacer le résultat, on garde l'affichage
    });

    // Nettoyage avant départ page
    window.addEventListener('beforeunload', () => {
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
        }
    });

    // Option : si le scan plante ou ne se lance pas, s'assurer que le bouton redevienne actif après arrêt
    // stopEverything le fait déjà.
})();
</script>
</body>
</html>
