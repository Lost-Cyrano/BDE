<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Scan Express · Code‑barres</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            background: white;
            border-radius: 32px 32px 28px 28px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            padding: 24px 20px 32px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b2b44;
            margin-bottom: 8px;
            padding-left: 4px;
        }
        .sub {
            color: #4a5f73;
            margin-bottom: 24px;
            font-size: 1rem;
            padding-left: 4px;
            border-left: 3px solid #3498db;
            padding-left: 12px;
        }
        .scan-area {
            background: #eef2f7;
            border-radius: 36px;
            padding: 30px 16px;
            text-align: center;
            margin-bottom: 28px;
            border: 2px dashed #b2c9de;
            transition: border 0.2s, background 0.2s;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .scan-area.scanning {
            background: #1a1e2b;
            border-color: #3498db;
            border-style: solid;
            padding: 8px 8px;
        }
        #scanner-btn {
            background: #0b2b44;
            border: none;
            color: white;
            font-size: 1.6rem;
            font-weight: 500;
            padding: 18px 18px;
            border-radius: 60px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 18px rgba(11,43,68,0.25);
            cursor: pointer;
            transition: 0.15s;
            margin-bottom: 8px;
            border: 1px solid #154a6e;
        }
        #scanner-btn:active {
            transform: scale(0.97);
            background: #0a1f30;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        #scanner-btn:disabled {
            opacity: 0.5;
            transform: none;
            pointer-events: none;
            background: #5f7d9c;
        }
        .btn-icon {
            font-size: 2rem;
            line-height: 1;
        }
        #video-container {
            width: 100%;
            border-radius: 28px;
            overflow: hidden;
            background: black;
            position: relative;
            display: none;
            margin-bottom: 12px;
        }
        #video-container.active {
            display: block;
        }
        #video {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 28px;
            transform: scaleX(-1);  /* effet miroir : plus naturel */
        }
        #stop-scan {
            background: #e63946;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 12px 20px;
            font-weight: 600;
            font-size: 1.2rem;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            border: 1px solid #b71c2c;
            transition: 0.15s;
        }
        #stop-scan:active {
            background: #b71c2c;
        }
        .info-panel {
            background: #ffffff;
            border-radius: 28px;
            padding: 22px 18px;
            box-shadow: inset 0 1px 4px #d0dbe8, 0 6px 14px rgba(0,10,20,0.08);
            margin: 16px 0 18px;
            word-break: break-word;
        }
        .info-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 14px;
            color: #1f3a5f;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .info-content {
            background: #f2f6fc;
            border-radius: 22px;
            padding: 18px 16px;
            font-size: 1rem;
            color: #102331;
            max-height: 380px;
            overflow-y: auto;
            border: 1px solid #cbd6e4;
        }
        .info-content pre {
            font-family: inherit;
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .error-msg {
            background: #fee9e7;
            border-left: 6px solid #c93e3e;
            padding: 18px 14px;
            border-radius: 22px;
            font-weight: 500;
            color: #7d2525;
        }
        .badge {
            background: #2ecc71;
            color: white;
            border-radius: 40px;
            padding: 4px 16px;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 10px;
        }
        .note {
            color: #3f5e7a;
            font-size: 0.85rem;
            text-align: center;
            margin-top: 16px;
            opacity: 0.75;
        }
        .debug-hint {
            font-size: 0.8rem;
            background: #eef3f9;
            padding: 8px 16px;
            border-radius: 30px;
            color: #2f577b;
        }
        /* responsive perfect */
        button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
    <!-- Bibliothèque de scan robuste : ZXing-js (version navigateur) -->
    <script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
</head>
<body>
<div class="container">
    <h1>📲 scan·code</h1>
    <div class="sub">pointez, lisez, tout savoir</div>

    <!-- zone dynamique scan / vidéo -->
    <div class="scan-area" id="scanArea">
        <div id="video-container">
            <video id="video" playsinline></video>
        </div>
        <button id="stop-scan" style="display: none;">⏹ Arrêter le scan</button>
    </div>

    <!-- Bouton principal scanner -->
    <button id="scanner-btn">
        <span class="btn-icon">📷</span> Scanner un article
    </button>

    <!-- Panneau d'affichage des infos -->
    <div class="info-panel" id="infoPanel">
        <div class="info-title">
            <span>📦 Résultat</span>
        </div>
        <div class="info-content" id="infoContent">
            <span class="debug-hint">En attente d’un scan...</span>
        </div>
    </div>
    <div class="note">appuyez sur le bouton, autorisez la caméra · compatible courses, livres, etc.</div>
</div>

<script>
(function() {
    // --- Éléments DOM ---
    const scannerBtn = document.getElementById('scanner-btn');
    const stopScanBtn = document.getElementById('stop-scan');
    const videoContainer = document.getElementById('video-container');
    const video = document.getElementById('video');
    const scanArea = document.getElementById('scanArea');
    const infoContent = document.getElementById('infoContent');

    // --- États internes ---
    let activeScanner = null;            // instance MultiFormatReader
    let mediaStream = null;              // flux caméra à stopper
    let isScanning = false;

    // --- Fonction d'affichage des infos (ou erreur) ---
    function displayResult(data, error = false) {
        if (error) {
            // message d'erreur explicite
            infoContent.innerHTML = `<div class="error-msg">❌ ${data}</div>`;
            return;
        }
        // data est un objet avec .code et .details (texte formaté)
        let html = `<div class="badge">✅ code scanné : ${data.code}</div>`;
        if (data.details && data.details !== '') {
            html += `<pre>${data.details}</pre>`;
        } else {
            html += `<div class="error-msg">⚠️ Aucune information trouvée dans les bases gratuites.</div>`;
        }
        infoContent.innerHTML = html;
    }

    // --- Fonction pour tout arrêter (caméra + scanner) et réactiver bouton ---
    function stopScanning() {
        if (!isScanning) return;

        // 1. Arrêter tous les flux video
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }

        // 2. Nettoyer le scanner (détache la lecture)
        if (activeScanner) {
            try {
                // @zxing n'a pas de méthode reset explicite, on se contente de lâcher la référence
                activeScanner = null;
            } catch (e) {}
        }

        // 3. Cacher la video, réinitialiser UI
        videoContainer.classList.remove('active');
        video.srcObject = null;
        stopScanBtn.style.display = 'none';
        scanArea.classList.remove('scanning');
        isScanning = false;
        scannerBtn.disabled = false;
    }

    // --- Interroger plusieurs bases (Open Food Facts + Open EAN/ISBN via upcdatabase? on utilise deux sources fiables)
    async function fetchProductInfo(barcode) {
        const code = barcode.trim();
        // on utilise Open Food Facts (alimentaire / cosmétique / divers) ET un fallback Open EAN / ISBN via Google Books? mais on va utiliser aussi une autre API : https://world.openfoodfacts.org/ couvre beaucoup.
        // Pour les livres, on utilisera Open Library (covers/ISBN) mais surtout Open Food Facts contient beaucoup de produits non alimentaires (cosmétiques, etc.)
        // On fait deux appels parallèles avec gestion d'échec.

        const OFF_URL = `https://world.openfoodfacts.org/api/v2/product/${code}.json`;
        // Deuxième source : Open EAN (gratuit, limité mais large) - on utilise le proxy public de upcdatabase? Non, préférons une source fiable comme Google Books pour les ISBN.
        // Pour les codes non alimentaires (livres), on peut appeler Open Library (couverture livres) et extraire titre/auteur.
        // On combine les promesses: on lance deux requêtes, et on fusionne.

        const results = {
            code: code,
            details: ''
        };

        try {
            // Requête 1: Open Food Facts (produits de grande conso, cosmétiques, boissons, etc.)
            const offPromise = fetch(OFF_URL).then(res => res.ok ? res.json() : Promise.reject('OFF not found')).catch(() => null);

            // Requête 2: Open Library (pour ISBN / livres) - si le code ressemble à un ISBN (10 ou 13 chiffres mais on tente systématiquement)
            const olPromise = fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${code}&format=json&jscmd=data`).then(res => res.json()).catch(() => null);

            // Requête 3 (bonus) : barcode lookups possible ? mais on s'arrête là, on veut gratuit et fiable. Ajout d'un autre endpoint : https://api.upcitemdb.com (mais nécessite api key) laisser tomber pour éviter les bugs. 
            // Alternative: https://de-upc.openfoodfacts.org (même base OFF). Donc on double OFF avec le champ "generic".

            // Attente des deux avec timeout soft
            const [offData, olData] = await Promise.all([offPromise, olPromise]);

            let combined = [];

            // --- Traitement Open Food Facts ---
            if (offData && offData.status === 1 && offData.product) {
                const p = offData.product;
                let productName = p.product_name || p.generic_name || 'Nom inconnu';
                let brand = p.brands || 'Marque inconnue';
                let quantity = p.quantity || '';
                let categories = p.categories || '';
                combined.push(`🍽️ [Open Food Facts]`);
                combined.push(`📛 ${productName} (${brand}) ${quantity}`);
                if (p.ingredients_text) combined.push(`🧪 Ingrédients: ${p.ingredients_text.substr(0,120)}...`);
                if (p.nutriscore_grade) combined.push(`⚖️ Nutriscore: ${p.nutriscore_grade.toUpperCase()}`);
                if (p.ecoscore_grade) combined.push(`🌿 Ecoscore: ${p.ecoscore_grade.toUpperCase()}`);
                combined.push(`🔗 https://fr.openfoodfacts.org/produit/${code}\n`);
            } else {
                combined.push(`🍏 Open Food Facts : produit non référencé.`);
            }

            // --- Traitement Open Library (livres) ---
            const key = `ISBN:${code}`;
            if (olData && olData[key]) {
                const book = olData[key];
                let title = book.title || 'Titre inconnu';
                let authors = book.authors ? book.authors.map(a => a.name).join(', ') : 'Auteur inconnu';
                let publishDate = book.publish_date || 'Date inconnue';
                let publishers = book.publishers ? book.publishers.map(p => p.name).join(', ') : 'Éditeur inconnu';
                combined.push(`\n📚 [Open Library - Livre]`);
                combined.push(`📖 Titre: ${title}`);
                combined.push(`✍️ Auteur(s): ${authors}`);
                combined.push(`🏢 Éditeur: ${publishers} (${publishDate})`);
                if (book.number_of_pages) combined.push(`📄 Pages: ${book.number_of_pages}`);
                combined.push(`🌐 https://openlibrary.org/isbn/${code}`);
            } else {
                combined.push(`📘 Open Library : aucun livre trouvé pour cet ISBN.`);
            }

            // Si les deux sont vides (pas de donnée), on le mentionne.
            if (!offData && !olData) {
                results.details = '';
                return results;   // déclenchera message "aucune info"
            }

            results.details = combined.join('\n');
            return results;

        } catch (err) {
            console.warn("Erreur lors des appels API:", err);
            results.details = '';
            return results;  // renvoie code mais sans détails → message d'erreur
        }
    }

    // --- Fonction qui démarre le scan (caméra + zxing) ---
    async function startScanner() {
        if (isScanning) return;

        // Réinitialise l'affichage info (optionnel)
        // mais on ne veut pas effacer une info précédente ? si si, le nouveau scan va apporter qqchose.
        infoContent.innerHTML = `<span class="debug-hint">Scan en cours, patientez...</span>`;

        try {
            // Demande de flux caméra (avec contrainte arrière de préférence)
            const constraints = {
                video: {
                    facingMode: { ideal: 'environment' },  // caméra arrière si possible
                    width: { min: 360, ideal: 640 }
                },
                audio: false
            };
            mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = mediaStream;

            // Affiche l'UI
            videoContainer.classList.add('active');
            stopScanBtn.style.display = 'block';
            scanArea.classList.add('scanning');
            scannerBtn.disabled = true;
            isScanning = true;

            // Joue la vidéo (nécessaire sur mobile)
            await video.play();

            // Initialisation du scanner ZXing
            const codeReader = new ZXing.BrowserMultiFormatReader();
            activeScanner = codeReader;

            // Lancer le decoding en continu depuis la video
            codeReader.decodeFromVideoElement(video, async (result, error) => {
                // error est un exception si aucun code trouvé (normal), on ignore.
                if (result) {
                    const barcode = result.getText();
                    if (barcode) {
                        // Dès qu'on a un code, on stoppe le scan immédiatement
                        stopScanning();  // coupe cam & scanner

                        // On affiche "recherche en cours"
                        infoContent.innerHTML = `<span class="debug-hint">📡 recherche base de données pour ${barcode}...</span>`;

                        // Appel aux bases de données
                        const productData = await fetchProductInfo(barcode);
                        // Si productData.details est vide -> pas d'info
                        if (!productData.details || productData.details.trim() === '') {
                            displayResult({code: barcode, details: ''}, false); // provoque "aucune info"
                        } else {
                            displayResult(productData, false);
                        }
                    }
                }
                // ne pas réagir sur les erreurs de scan (pas de code trouvé)
            });

        } catch (err) {
            console.error('Erreur accès caméra ou scan:', err);
            stopScanning(); // nettoie au cas où
            // Afficher une erreur dans le panneau
            displayResult(`Impossible d'accéder à la caméra. Vérifiez les permissions.`, true);
            scannerBtn.disabled = false; // réactiver manuellement car stopScanning a déjà été appelé si erreur après flux? 
            // si stopScanning n'est pas appelé (erreur avant), on le force:
            if (mediaStream) {
                mediaStream.getTracks().forEach(t => t.stop());
                mediaStream = null;
            }
            isScanning = false;
            scannerBtn.disabled = false;
            videoContainer.classList.remove('active');
            stopScanBtn.style.display = 'none';
        }
    }

    // --- Gestionnaire bouton scanner ---
    scannerBtn.addEventListener('click', () => {
        startScanner();
    });

    // --- Gestionnaire bouton stop ---
    stopScanBtn.addEventListener('click', () => {
        stopScanning();
        // Ne pas effacer l'affichage info, juste remettre le bouton
    });

    // --- Nettoyage si on quitte la page (pas obligatoire mais propre)
    window.addEventListener('beforeunload', () => {
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
        }
    });

    // --- Petite amélioration : clic sur stop alors que déjà arrêté? déjà safe.
    // --- pour éviter que le bouton scanner reste bloqué si crash, on ajoute un guard.
})();
</script>
</body>
    </html>
