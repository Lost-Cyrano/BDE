<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>ScanEAN - Scanner de codes-barres</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f5f7fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            padding: 24px;
        }

        h1 {
            font-size: 28px;
            font-weight: 600;
            color: #1a1e2b;
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666c7e;
            font-size: 16px;
            margin-bottom: 32px;
        }

        .scan-btn {
            background: #0066ff;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 18px 32px;
            font-size: 18px;
            font-weight: 500;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 16px rgba(0, 102, 255, 0.2);
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .scan-btn:active {
            transform: scale(0.97);
            background: #0052cc;
            box-shadow: 0 4px 8px rgba(0, 102, 255, 0.2);
        }

        .scan-btn:disabled {
            background: #a0a8b8;
            box-shadow: none;
            transform: none;
            cursor: not-allowed;
        }

        .scanner-container {
            width: 100%;
            border-radius: 24px;
            overflow: hidden;
            background: #1a1e2b;
            margin-bottom: 24px;
            position: relative;
            aspect-ratio: 4/3;
            display: none;
        }

        .scanner-container.active {
            display: block;
        }

        #scanner {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            pointer-events: none;
        }

        .scan-line {
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: #00ff88;
            animation: scan 2s linear infinite;
            opacity: 0.8;
            box-shadow: 0 0 10px #00ff88;
        }

        @keyframes scan {
            0% { top: 10%; }
            50% { top: 90%; }
            100% { top: 10%; }
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #0066ff;
            font-weight: 500;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 12px;
            border: 4px solid #eef2f6;
            border-top-color: #0066ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-message {
            background: #fff2f0;
            border-left: 4px solid #ff4d4f;
            padding: 20px;
            border-radius: 16px;
            margin: 20px 0;
            color: #cf1322;
            display: none;
        }

        .error-message.active {
            display: block;
        }

        .product-info {
            background: #f8fafd;
            border-radius: 24px;
            padding: 24px;
            margin-top: 20px;
            display: none;
        }

        .product-info.active {
            display: block;
        }

        .product-name {
            font-size: 22px;
            font-weight: 600;
            color: #1a1e2b;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .product-brand {
            font-size: 16px;
            color: #0066ff;
            margin-bottom: 20px;
            font-weight: 500;
        }

        .product-detail {
            display: flex;
            align-items: baseline;
            padding: 12px 0;
            border-bottom: 1px solid #e9edf2;
        }

        .product-detail:last-child {
            border-bottom: none;
        }

        .detail-label {
            flex: 1;
            color: #666c7e;
            font-size: 15px;
        }

        .detail-value {
            flex: 2;
            color: #1a1e2b;
            font-weight: 500;
            font-size: 15px;
            text-align: right;
            word-break: break-word;
        }

        .barcode-badge {
            background: #eef2f6;
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 14px;
            color: #444a5a;
            display: inline-block;
            margin-bottom: 16px;
            font-family: monospace;
        }

        .note {
            text-align: center;
            color: #888f9e;
            font-size: 13px;
            margin-top: 24px;
            border-top: 1px solid #eef2f6;
            padding-top: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📱 ScanEAN</h1>
        <p class="subtitle">Scannez un code-barres pour obtenir les infos produit</p>

        <button class="scan-btn" id="scanBtn">
            <span>📷</span> Scanner un article
        </button>

        <div class="scanner-container" id="scannerContainer">
            <video id="scanner" playsinline></video>
            <div class="scan-overlay"></div>
            <div class="scan-line"></div>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            Recherche des informations...
        </div>

        <div class="error-message" id="errorMessage">
            ❌ Produit non trouvé dans les bases de données
        </div>

        <div class="product-info" id="productInfo">
            <div class="barcode-badge" id="barcodeDisplay">Code: </div>
            <div class="product-name" id="productName"></div>
            <div class="product-brand" id="productBrand"></div>
            
            <div class="product-detail">
                <span class="detail-label">Quantité</span>
                <span class="detail-value" id="productQuantity"></span>
            </div>
            
            <div class="product-detail">
                <span class="detail-label">Catégories</span>
                <span class="detail-value" id="productCategories"></span>
            </div>
            
            <div class="product-detail">
                <span class="detail-label">Labels</span>
                <span class="detail-value" id="productLabels"></span>
            </div>
            
            <div class="product-detail">
                <span class="detail-label">Pays de vente</span>
                <span class="detail-value" id="productCountries"></span>
            </div>
            
            <div class="product-detail">
                <span class="detail-label">Ingrédients</span>
                <span class="detail-value" id="productIngredients"></span>
            </div>
            
            <div class="product-detail">
                <span class="detail-label">Nutri-Score</span>
                <span class="detail-value" id="productNutriscore"></span>
            </div>
            
            <div class="product-detail">
                <span class="detail-label">Eco-Score</span>
                <span class="detail-value" id="productEcoscore"></span>
            </div>
        </div>

        <p class="note">Données fournies par Open Food Facts 🌍</p>
    </div>

    <!-- Inclusion de la bibliothèque de scan -->
    <script src="https://unpkg.com/@ericblade/quagga2@1.8.2/dist/quagga.min.js"></script>
    
    <script>
        // Éléments DOM
        const scanBtn = document.getElementById('scanBtn');
        const scannerContainer = document.getElementById('scannerContainer');
        const scannerVideo = document.getElementById('scanner');
        const loading = document.getElementById('loading');
        const errorMessage = document.getElementById('errorMessage');
        const productInfo = document.getElementById('productInfo');
        
        // Éléments produit
        const barcodeDisplay = document.getElementById('barcodeDisplay');
        const productName = document.getElementById('productName');
        const productBrand = document.getElementById('productBrand');
        const productQuantity = document.getElementById('productQuantity');
        const productCategories = document.getElementById('productCategories');
        const productLabels = document.getElementById('productLabels');
        const productCountries = document.getElementById('productCountries');
        const productIngredients = document.getElementById('productIngredients');
        const productNutriscore = document.getElementById('productNutriscore');
        const productEcoscore = document.getElementById('productEcoscore');

        let isScanning = false;
        let stream = null;

        // Fonction pour arrêter la caméra
        async function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (window.Quagga) {
                try {
                    await Quagga.stop();
                } catch (e) {
                    console.log('Quagga déjà arrêté');
                }
            }
            scannerContainer.classList.remove('active');
            isScanning = false;
        }

        // Fonction pour démarrer le scan
        async function startScan() {
            try {
                // Cacher les résultats précédents
                productInfo.classList.remove('active');
                errorMessage.classList.remove('active');
                
                // Demander l'accès à la caméra
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                
                scannerVideo.srcObject = stream;
                scannerContainer.classList.add('active');
                
                // Initialiser Quagga pour le décodage
                await Quagga.init({
                    inputStream: {
                        name: "Live",
                        type: "LiveStream",
                        target: scannerVideo,
                        constraints: {
                            facingMode: "environment"
                        }
                    },
                    decoder: {
                        readers: [
                            "ean_reader",
                            "ean_8_reader",
                            "upc_reader",
                            "upc_e_reader",
                            "code_128_reader",
                            "code_39_reader"
                        ]
                    }
                }, function(err) {
                    if (err) {
                        console.error('Erreur Quagga:', err);
                        return;
                    }
                    Quagga.start();
                });

                // Détection des codes-barres
                Quagga.onDetected(async function(result) {
                    const code = result.codeResult.code;
                    if (code && isScanning) {
                        isScanning = false; // Empêcher les scans multiples
                        await stopCamera();
                        await searchProduct(code);
                    }
                });

                isScanning = true;

            } catch (error) {
                console.error('Erreur caméra:', error);
                alert('Impossible d\'accéder à la caméra. Vérifiez les permissions.');
                stopCamera();
            }
        }

        // Fonction pour rechercher le produit sur Open Food Facts
        async function searchProduct(barcode) {
            loading.classList.add('active');
            productInfo.classList.remove('active');
            errorMessage.classList.remove('active');

            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${barcode}.json`);
                const data = await response.json();

                loading.classList.remove('active');

                if (data.status === 1) {
                    // Produit trouvé
                    displayProduct(data.product, barcode);
                } else {
                    // Produit non trouvé
                    errorMessage.classList.add('active');
                }
            } catch (error) {
                console.error('Erreur API:', error);
                loading.classList.remove('active');
                errorMessage.querySelector('span').textContent = '❌ Erreur de connexion';
                errorMessage.classList.add('active');
            }
        }

        // Fonction pour afficher les informations du produit
        function displayProduct(product, barcode) {
            barcodeDisplay.textContent = `Code: ${barcode}`;
            
            productName.textContent = product.product_name || 'Nom non disponible';
            productBrand.textContent = product.brands || 'Marque non spécifiée';
            
            productQuantity.textContent = product.quantity || 'Non spécifié';
            productCategories.textContent = product.categories ? product.categories.split(',').slice(0, 3).join(', ') : 'Non spécifié';
            productLabels.textContent = product.labels ? product.labels.split(',').slice(0, 3).join(', ') : 'Non spécifié';
            productCountries.textContent = product.countries ? product.countries.split(',').slice(0, 3).join(', ') : 'Non spécifié';
            
            // Ingrédients (limité à 100 caractères)
            const ingredients = product.ingredients_text || 'Non spécifié';
            productIngredients.textContent = ingredients.length > 100 ? ingredients.substring(0, 100) + '...' : ingredients;
            
            // Scores
            productNutriscore.textContent = product.nutriscore_grade ? product.nutriscore_grade.toUpperCase() : 'Non spécifié';
            productEcoscore.textContent = product.ecoscore_grade ? product.ecoscore_grade.toUpperCase() : 'Non spécifié';

            productInfo.classList.add('active');
        }

        // Gestionnaire du bouton de scan
        scanBtn.addEventListener('click', async () => {
            if (isScanning) {
                await stopCamera();
            } else {
                await startScan();
            }
        });

        // Nettoyage à la fermeture
        window.addEventListener('beforeunload', () => {
            stopCamera();
        });
    </script>
</body>
  </html>
