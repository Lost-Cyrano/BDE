<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ScanMaster - Scanner de codes-barres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: white;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .header {
            background: #2c3e50;
            color: white;
            padding: 24px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .main-content {
            padding: 20px;
        }

        /* Bouton de scan */
        .scan-button {
            background: #3498db;
            color: white;
            border: none;
            border-radius: 60px;
            padding: 20px;
            font-size: 20px;
            font-weight: 600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 8px 16px rgba(52,152,219,0.3);
            margin-bottom: 20px;
        }

        .scan-button:active {
            transform: scale(0.98);
            background: #2980b9;
        }

        .scan-button.scanning {
            background: #e74c3c;
            box-shadow: 0 8px 16px rgba(231,76,60,0.3);
        }

        /* Zone du scanner */
        .scanner-wrapper {
            width: 100%;
            aspect-ratio: 1;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            position: relative;
            margin-bottom: 20px;
            display: none;
        }

        .scanner-wrapper.active {
            display: block;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scan-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 24px;
        }

        .scan-corner {
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #3498db;
            border-style: solid;
            border-width: 0;
        }

        .corner-tl {
            top: 20px;
            left: 20px;
            border-top-width: 4px;
            border-left-width: 4px;
        }

        .corner-tr {
            top: 20px;
            right: 20px;
            border-top-width: 4px;
            border-right-width: 4px;
        }

        .corner-bl {
            bottom: 20px;
            left: 20px;
            border-bottom-width: 4px;
            border-left-width: 4px;
        }

        .corner-br {
            bottom: 20px;
            right: 20px;
            border-bottom-width: 4px;
            border-right-width: 4px;
        }

        .scan-line-anim {
            position: absolute;
            left: 10%;
            right: 10%;
            height: 2px;
            background: #3498db;
            animation: scanMove 2s linear infinite;
            box-shadow: 0 0 10px #3498db;
        }

        @keyframes scanMove {
            0% { top: 15%; }
            50% { top: 85%; }
            100% { top: 15%; }
        }

        .scan-hint {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            font-size: 14px;
            text-shadow: 0 2px 4px black;
            background: rgba(0,0,0,0.5);
            padding: 8px;
        }

        /* États */
        .loading-state, .error-state, .result-state {
            display: none;
            padding: 20px;
            border-radius: 20px;
            margin: 20px 0;
        }

        .loading-state.active, .error-state.active, .result-state.active {
            display: block;
        }

        .loading-state {
            background: #f8f9fa;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e0e0e0;
            border-top-color: #3498db;
            border-radius: 50%;
            margin: 10px auto;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error-state {
            background: #fee;
            color: #c00;
            text-align: center;
            border-left: 4px solid #c00;
        }

        .result-state {
            background: #f8f9fa;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .barcode-badge {
            background: #2c3e50;
            color: white;
            padding: 6px 12px;
            border-radius: 30px;
            font-family: monospace;
            font-size: 14px;
        }

        .source-badge {
            background: #3498db;
            color: white;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 12px;
        }

        .result-name {
            font-size: 22px;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .result-brand {
            color: #7f8c8d;
            margin-bottom: 20px;
        }

        .result-details {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .detail-item {
            display: flex;
            padding: 8px 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .detail-label {
            flex: 1;
            color: #7f8c8d;
            font-size: 14px;
        }

        .detail-value {
            flex: 2;
            color: #2c3e50;
            font-weight: 500;
            font-size: 14px;
            text-align: right;
        }

        .sources-tabs {
            display: flex;
            gap: 8px;
            margin: 15px 0;
            overflow-x: auto;
            padding: 5px 0;
        }

        .source-tab {
            background: white;
            border: 1px solid #ddd;
            border-radius: 30px;
            padding: 8px 16px;
            font-size: 13px;
            white-space: nowrap;
            cursor: pointer;
        }

        .source-tab.active {
            background: #3498db;
            color: white;
            border-color: #3498db;
        }

        .new-scan-btn {
            background: none;
            border: 2px solid #3498db;
            color: #3498db;
            border-radius: 60px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            margin-top: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .new-scan-btn:active {
            background: #3498db;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📱 ScanMaster</h1>
            <p>Scannez n'importe quel code-barres</p>
        </div>

        <div class="main-content">
            <!-- Bouton de scan principal -->
            <button class="scan-button" id="scanButton">
                <span>📷</span> Scanner un article
            </button>

            <!-- Zone du scanner -->
            <div class="scanner-wrapper" id="scannerWrapper">
                <video id="video" playsinline></video>
                <div class="scan-overlay"></div>
                <div class="scan-corner corner-tl"></div>
                <div class="scan-corner corner-tr"></div>
                <div class="scan-corner corner-bl"></div>
                <div class="scan-corner corner-br"></div>
                <div class="scan-line-anim"></div>
                <div class="scan-hint">Positionnez le code-barres dans le cadre</div>
            </div>

            <!-- États -->
            <div class="loading-state" id="loadingState">
                <div class="spinner"></div>
                <p>Recherche du produit...</p>
            </div>

            <div class="error-state" id="errorState">
                <p>❌ Aucun produit trouvé pour ce code-barres</p>
            </div>

            <div class="result-state" id="resultState">
                <div class="result-header">
                    <span class="barcode-badge" id="barcodeDisplay">Code: </span>
                    <span class="source-badge" id="sourceDisplay">Source: </span>
                </div>
                <div class="result-name" id="productName"></div>
                <div class="result-brand" id="productBrand"></div>
                <div class="result-details" id="productDetails"></div>
                
                <!-- Sources alternatives -->
                <div id="alternativeSources" style="display: none;">
                    <div style="margin: 20px 0 10px; color: #7f8c8d;">Autres sources disponibles:</div>
                    <div class="sources-tabs" id="sourcesTabs"></div>
                </div>
            </div>

            <!-- Bouton nouveau scan (caché par défaut) -->
            <button class="new-scan-btn" id="newScanBtn" style="display: none;">
                ↺ Scanner un autre article
            </button>
        </div>
    </div>

    <!-- Librairie jsQR -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <script>
        // Éléments DOM
        const scanButton = document.getElementById('scanButton');
        const scannerWrapper = document.getElementById('scannerWrapper');
        const video = document.getElementById('video');
        const loadingState = document.getElementById('loadingState');
        const errorState = document.getElementById('errorState');
        const resultState = document.getElementById('resultState');
        const newScanBtn = document.getElementById('newScanBtn');
        const barcodeDisplay = document.getElementById('barcodeDisplay');
        const sourceDisplay = document.getElementById('sourceDisplay');
        const productName = document.getElementById('productName');
        const productBrand = document.getElementById('productBrand');
        const productDetails = document.getElementById('productDetails');
        const alternativeSources = document.getElementById('alternativeSources');
        const sourcesTabs = document.getElementById('sourcesTabs');

        // Variables d'état
        let isScanning = false;
        let videoStream = null;
        let animationId = null;
        let currentBarcode = '';

        // Configuration des bases de données
        const databases = [
            {
                id: 'food',
                name: '🍔 Open Food Facts',
                url: (barcode) => `https://world.openfoodfacts.org/api/v2/product/${barcode}.json`,
                parser: (data) => {
                    if (!data || data.status !== 1) return null;
                    const p = data.product;
                    return {
                        name: p.product_name || 'Nom inconnu',
                        brand: p.brands || 'Marque inconnue',
                        details: [
                            { label: '📦 Quantité', value: p.quantity || 'Non spécifié' },
                            { label: '🏷️ Catégories', value: p.categories ? p.categories.split(',').slice(0,2).join(', ') : 'Non spécifié' },
                            { label: '⭐ Nutri-Score', value: p.nutriscore_grade ? p.nutriscore_grade.toUpperCase() : 'Non spécifié' },
                            { label: '🌍 Labels', value: p.labels ? p.labels.split(',').slice(0,2).join(', ') : 'Non spécifié' }
                        ]
                    };
                }
            },
            {
                id: 'beauty',
                name: '💄 Open Beauty Facts',
                url: (barcode) => `https://world.openbeautyfacts.org/api/v2/product/${barcode}.json`,
                parser: (data) => {
                    if (!data || data.status !== 1) return null;
                    const p = data.product;
                    return {
                        name: p.product_name || 'Nom inconnu',
                        brand: p.brands || 'Marque inconnue',
                        details: [
                            { label: '🧴 Type', value: p.categories ? p.categories.split(',')[0] : 'Non spécifié' },
                            { label: '🏭 Marque', value: p.brands || 'Non spécifié' },
                            { label: '✅ Labels', value: p.labels || 'Non spécifié' },
                            { label: '📏 Contenance', value: p.quantity || 'Non spécifié' }
                        ]
                    };
                }
            },
            {
                id: 'product',
                name: '📦 Open Product Facts',
                url: (barcode) => `https://world.openproductfacts.org/api/v2/product/${barcode}.json`,
                parser: (data) => {
                    if (!data || data.status !== 1) return null;
                    const p = data.product;
                    return {
                        name: p.product_name || 'Nom inconnu',
                        brand: p.brands || 'Marque inconnue',
                        details: [
                            { label: '📋 Catégorie', value: p.categories || 'Non spécifié' },
                            { label: '📦 Emballage', value: p.packaging || 'Non spécifié' },
                            { label: '🌱 Eco-Score', value: p.ecoscore_grade ? p.ecoscore_grade.toUpperCase() : 'Non spécifié' },
                            { label: '🌍 Origine', value: p.countries || 'Non spécifié' }
                        ]
                    };
                }
            }
        ];

        // Arrêter le scan proprement
        async function stopScanning() {
            isScanning = false;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
            
            video.srcObject = null;
            scannerWrapper.classList.remove('active');
            scanButton.classList.remove('scanning');
            scanButton.innerHTML = '<span>📷</span> Scanner un article';
        }

        // Démarrer le scan
        async function startScanning() {
            try {
                // Réinitialiser l'interface
                await stopScanning();
                resultState.classList.remove('active');
                errorState.classList.remove('active');
                loadingState.classList.remove('active');
                newScanBtn.style.display = 'none';
                
                // Demander l'accès à la caméra
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    } 
                });
                
                video.srcObject = videoStream;
                scannerWrapper.classList.add('active');
                scanButton.classList.add('scanning');
                scanButton.innerHTML = '<span>⏹️</span> Arrêter le scan';
                
                // Attendre que la vidéo soit prête
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                isScanning = true;
                scanFrame();
                
            } catch (error) {
                console.error('Erreur caméra:', error);
                alert('Impossible d\'accéder à la caméra. Vérifiez les permissions.');
                await stopScanning();
            }
        }

        // Analyser les frames vidéo
        function scanFrame() {
            if (!isScanning) return;
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                
                const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, canvas.width, canvas.height, {
                    inversionAttempts: "dontInvert",
                });
                
                if (code && code.data) {
                    console.log('Code détecté:', code.data);
                    handleDetectedBarcode(code.data);
                    return;
                }
            }
            
            animationId = requestAnimationFrame(scanFrame);
        }

        // Gérer le code-barres détecté
        async function handleDetectedBarcode(barcode) {
            if (!isScanning) return;
            
            currentBarcode = barcode;
            await stopScanning();
            
            // Afficher le chargement
            loadingState.classList.add('active');
            
            // Rechercher dans toutes les bases de données
            await searchAllDatabases(barcode);
        }

        // Rechercher dans toutes les bases de données
        async function searchAllDatabases(barcode) {
            const results = [];
            
            for (const db of databases) {
                try {
                    const response = await fetch(db.url(barcode));
                    const data = await response.json();
                    const parsed = db.parser(data);
                    
                    if (parsed) {
                        results.push({
                            source: db.name,
                            data: parsed
                        });
                    }
                } catch (error) {
                    console.log(`Erreur avec ${db.name}:`, error);
                }
            }
            
            loadingState.classList.remove('active');
            
            if (results.length > 0) {
                displayResults(results, barcode);
            } else {
                errorState.classList.add('active');
                newScanBtn.style.display = 'block';
            }
        }

        // Afficher les résultats
        function displayResults(results, barcode) {
            const mainResult = results[0];
            
            barcodeDisplay.textContent = `Code: ${barcode}`;
            sourceDisplay.textContent = `Source: ${mainResult.source}`;
            productName.textContent = mainResult.data.name;
            productBrand.textContent = mainResult.data.brand;
            
            // Aff
